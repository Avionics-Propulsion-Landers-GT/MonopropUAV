<!-- Fragment 1: open loop vs closed loop. Uses .diagram classes from styles.css -->
<figure class="diagram" id="fig-loops">
<svg viewBox="0 0 900 430" role="img" aria-labelledby="fig-loops-t fig-loops-d">
  <title id="fig-loops-t">Open loop versus closed loop</title>
  <desc id="fig-loops-d">Top: a plan feeds a controller that commands the rocket, and nothing comes back. Bottom: the same chain, but a sensor measures the real altitude and the difference from the target is what the controller acts on.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--ink-2)"/></marker>
    <marker id="ah-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--sig-fb)"/></marker>
    <marker id="ah-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--sig-ref)"/></marker>
  </defs>

  <!-- open loop -->
  <text x="20" y="34" class="label" style="font-weight:700">Open loop</text>
  <text x="112" y="34" class="dim">the controller never hears back</text>
  <rect class="box" x="20" y="70" width="170" height="64" rx="3"/>
  <text x="105" y="96" text-anchor="middle" class="label">Target</text>
  <text x="105" y="116" text-anchor="middle">hold 10 m</text>
  <path class="wire wire-ref" d="M190 102 H262" marker-end="url(#ah-ref)"/>
  <rect class="box" x="264" y="70" width="210" height="64" rx="3"/>
  <text x="369" y="96" text-anchor="middle" class="label">Controller</text>
  <text x="369" y="116" text-anchor="middle">thrust = weight = 9.81 N</text>
  <path class="wire" d="M474 102 H546" marker-end="url(#ah)"/>
  <text x="510" y="60" text-anchor="middle" class="dim">valve %</text>
  <rect class="box box-hot" x="548" y="70" width="150" height="64" rx="3"/>
  <text x="623" y="96" text-anchor="middle" class="label">Rocket</text>
  <text x="623" y="116" text-anchor="middle">1 kg, lag 0.2 s</text>
  <path class="wire" d="M698 102 H860" marker-end="url(#ah)"/>
  <text x="780" y="92" text-anchor="middle" class="dim">real altitude</text>
  <text x="780" y="128" text-anchor="middle" class="dim">(nobody is looking)</text>

  <line x1="20" y1="180" x2="880" y2="180" style="stroke:var(--line)"/>

  <!-- closed loop -->
  <text x="20" y="220" class="label" style="font-weight:700">Closed loop</text>
  <text x="128" y="220" class="dim">measure, compare, correct, repeat</text>
  <rect class="box" x="20" y="256" width="150" height="64" rx="3"/>
  <text x="95" y="282" text-anchor="middle" class="label">Target</text>
  <text x="95" y="302" text-anchor="middle">10 m</text>
  <path class="wire wire-ref" d="M170 288 H212" marker-end="url(#ah-ref)"/>
  <circle cx="232" cy="288" r="16" class="box"/>
  <text x="232" y="292" text-anchor="middle" style="font-size:14px">Σ</text>
  <text x="232" y="336" text-anchor="middle" class="dim" style="font-size:11px">compare</text>
  <text x="206" y="276" class="dim" style="font-size:11px">+</text>
  <text x="238" y="323" class="dim" style="font-size:11px">−</text>
  <path class="wire" d="M248 288 H300" marker-end="url(#ah)"/>
  <text x="274" y="276" text-anchor="middle" class="dim">error</text>
  <rect class="box" x="302" y="256" width="190" height="64" rx="3"/>
  <text x="397" y="282" text-anchor="middle" class="label">Controller</text>
  <text x="397" y="302" text-anchor="middle">error → thrust</text>
  <path class="wire" d="M492 288 H546" marker-end="url(#ah)"/>
  <rect class="box box-hot" x="548" y="256" width="150" height="64" rx="3"/>
  <text x="623" y="282" text-anchor="middle" class="label">Rocket</text>
  <text x="623" y="302" text-anchor="middle">1 kg, lag 0.2 s</text>
  <path class="wire" d="M698 288 H860" marker-end="url(#ah)"/>
  <text x="780" y="278" text-anchor="middle" class="dim">real altitude</text>
  <!-- feedback path -->
  <circle cx="740" cy="288" r="3" style="fill:var(--ink-2)"/>
  <path class="wire wire-fb" d="M740 288 V386 H572"/>
  <rect class="box" x="380" y="360" width="190" height="52" rx="3"/>
  <text x="475" y="381" text-anchor="middle" class="label">Sensors</text>
  <text x="475" y="400" text-anchor="middle" style="font-size:11px">rangefinder, IMU → EKF</text>
  <path class="wire wire-fb" d="M380 386 H232 V306" marker-end="url(#ah-fb)"/>
  <text x="306" y="376" text-anchor="middle" class="dim">measured altitude</text>
</svg>
<figcaption>Same target, same controller, same rocket. The only difference is the red wire: the closed loop knows what actually happened.</figcaption>
</figure>

<!-- Fragment 2: the GNC loop with repo folders -->
<figure class="diagram" id="fig-gnc">
<svg viewBox="0 0 1000 440" role="img" aria-labelledby="fig-gnc-t fig-gnc-d">
  <title id="fig-gnc-t">How guidance, navigation and control fit together on Monarch</title>
  <desc id="fig-gnc-d">Guidance plans a reference trajectory. The controller compares it with the navigation estimate and commands the throttle valve and gimbal servos. The vehicle moves, sensors measure it, the EKF turns measurements into a state estimate, and the loop repeats.</desc>
  <defs>
    <marker id="gh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--ink-2)"/></marker>
    <marker id="gh-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--sig-ref)"/></marker>
    <marker id="gh-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--sig-fb)"/></marker>
    <marker id="gh-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--bad)"/></marker>
  </defs>

  <!-- Guidance -->
  <rect class="box" x="20" y="40" width="270" height="78" rx="3"><title>Guidance team (path planning). Owns the reference trajectory.</title></rect>
  <text x="155" y="66" text-anchor="middle" class="label" style="font-weight:700">Guidance</text>
  <text x="155" y="86" text-anchor="middle">plans the hop</text>
  <text x="155" y="106" text-anchor="middle" class="dim" style="font-size:11px">Algorithms/LosslessConvexification</text>

  <!-- Controller -->
  <rect class="box box-hot" x="365" y="40" width="270" height="78" rx="3"><title>Control team. Turns reference plus state into thrust and gimbal commands.</title></rect>
  <text x="500" y="66" text-anchor="middle" class="label" style="font-weight:700">Controller (MPC)</text>
  <text x="500" y="86" text-anchor="middle">this guide</text>
  <text x="500" y="106" text-anchor="middle" class="dim" style="font-size:11px">Algorithms/MPC · ControlLoopMPC</text>

  <!-- Actuators -->
  <rect class="box" x="710" y="40" width="270" height="78" rx="3"><title>Avionics subteam. Firmware that drives the valve servo, TVC servos and RCS.</title></rect>
  <text x="845" y="66" text-anchor="middle" class="label" style="font-weight:700">Actuators</text>
  <text x="845" y="86" text-anchor="middle">throttle valve, gimbal servos, RCS</text>
  <text x="845" y="106" text-anchor="middle" class="dim" style="font-size:11px">AvionicsFirmware · firmware</text>

  <!-- Vehicle -->
  <rect class="box" x="710" y="186" width="200" height="64" rx="3"><title>The vehicle. Everyone's problem.</title></rect>
  <text x="810" y="212" text-anchor="middle" class="label" style="font-weight:700">Monarch</text>
  <text x="810" y="232" text-anchor="middle">1000 N hybrid lander</text>

  <!-- Sensors -->
  <rect class="box" x="710" y="318" width="270" height="78" rx="3"><title>Avionics subteam builds them; Navigation reads them.</title></rect>
  <text x="845" y="344" text-anchor="middle" class="label" style="font-weight:700">Sensors</text>
  <text x="845" y="364" text-anchor="middle">IMU, magnetometer, GPS, UWB, barometer, rangefinder</text>
  <text x="845" y="384" text-anchor="middle" class="dim" style="font-size:11px">Electronics</text>

  <!-- Navigation -->
  <rect class="box" x="365" y="318" width="270" height="78" rx="3"><title>Navigation team (sensor fusion). Owns the state estimate.</title></rect>
  <text x="500" y="344" text-anchor="middle" class="label" style="font-weight:700">Navigation (EKF)</text>
  <text x="500" y="364" text-anchor="middle">turns noisy readings into a state</text>
  <text x="500" y="384" text-anchor="middle" class="dim" style="font-size:11px">Sensing&amp;Controls/AttitudeEstimation</text>

  <!-- wires -->
  <path id="w-ref" class="wire wire-ref" d="M290 79 H363" marker-end="url(#gh-ref)"/>
  <text x="327" y="30" text-anchor="middle" class="dim">reference trajectory</text>
  <path id="w-cmd" class="wire" d="M635 79 H708" marker-end="url(#gh)"/>
  <text x="672" y="30" text-anchor="middle" class="dim">thrust N, gimbal deg</text>
  <path id="w-act" class="wire" d="M810 118 V184" marker-end="url(#gh)"/>
  <text x="822" y="156" class="dim">valve %, servo angle</text>
  <path id="w-veh" class="wire" d="M810 250 V316" marker-end="url(#gh)"/>
  <text x="822" y="288" class="dim">the real world</text>
  <path id="w-sen" class="wire wire-fb" d="M710 357 H637" marker-end="url(#gh-fb)"/>
  <text x="672" y="306" text-anchor="middle" class="dim">raw readings</text>
  <path id="w-nav" class="wire wire-fb" d="M500 318 V120" marker-end="url(#gh-fb)"/>
  <text x="512" y="222" class="dim">state estimate</text>
  <text x="512" y="238" class="dim" style="font-size:11px">position, velocity, attitude, rates</text>
  <path id="w-nav2" class="wire wire-fb" d="M365 357 H155 V120" marker-end="url(#gh-fb)"/>
  <text x="167" y="222" class="dim">where we are now</text>
  <!-- disturbances -->
  <path class="wire" style="stroke:var(--bad);stroke-dasharray:4 4" d="M992 218 H922" marker-end="url(#gh-bad)"/>
  <text x="956" y="196" text-anchor="middle" class="dim" style="fill:var(--bad);font-size:11px">wind, slosh,</text>
  <text x="956" y="209" text-anchor="middle" class="dim" style="fill:var(--bad);font-size:11px">mass change</text>

  <!-- moving dots along the loop; hidden under prefers-reduced-motion via CSS -->
  <g class="flow">
    <circle r="3.5" class="dot"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s"><mpath href="#w-ref"/></animateMotion></circle>
    <circle r="3.5" class="dot"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.4s"><mpath href="#w-cmd"/></animateMotion></circle>
    <circle r="3.5" class="dot"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.8s"><mpath href="#w-act"/></animateMotion></circle>
    <circle r="3.5" class="dot"><animateMotion dur="1.6s" repeatCount="indefinite" begin="1.2s"><mpath href="#w-veh"/></animateMotion></circle>
    <circle r="3.5" class="dot"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#w-sen"/></animateMotion></circle>
    <circle r="3.5" class="dot"><animateMotion dur="3s" repeatCount="indefinite" begin="2.0s"><mpath href="#w-nav"/></animateMotion></circle>
    <circle r="3.5" class="dot"><animateMotion dur="4s" repeatCount="indefinite" begin="2.0s"><mpath href="#w-nav2"/></animateMotion></circle>
  </g>
</svg>
<figcaption>One tick of the flight loop. Guidance and navigation each hand the controller one thing; the controller hands the hardware two numbers. Then the world happens and it all runs again.</figcaption>
</figure>
